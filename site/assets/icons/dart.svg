<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 100" width="84" height="100" role="img" aria-label="Dart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Dart</title>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes drawL{from{stroke-dashoffset:1}}
@keyframes trav{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(640px);opacity:0}}
.pop,.rise{animation:rise .6s ease-out var(--d,0s) both}
.f{animation:fade .8s ease-out var(--d,0s) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
.spine{transform-box:fill-box;transform-origin:top;animation:growY .9s ease-out both}
.trav{animation:trav 5s ease-in-out 2.2s infinite}
.ul{stroke-dasharray:1;animation:drawL .8s ease-out var(--d,0s) both}
@media (prefers-reduced-motion:reduce){.pop,.rise,.f,.pulse,.spine,.trav,.ul{animation:none}.trav{opacity:0}}
</style>
<rect x=".75" y=".75" width="82.5" height="98.5" rx="14" fill="#131315" stroke="#2E2E33" stroke-width="1.5"/>
<g class="pop" style="--d:0.49s"><g transform="translate(6,4)"><path d="M36 14 L58 34 L36 54 L14 34 Z" fill="#2BB7DA" stroke="#2BB7DA" stroke-width="4" stroke-linejoin="round"/><path d="M36 25 L47 34 L36 43 L25 34 Z" fill="#0A0A0B"/></g></g>
<text x="42" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#F3EFE6">Dart</text>
</svg>
