<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 176" width="580" height="176" role="img" aria-labelledby="t">
<title id="t">Health Monitoring System</title>
<defs><pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2B4C80" stroke-width="1" opacity="0.3"/></pattern>
<pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#3B6AA8" stroke-width="1.2" opacity="0.0"/></pattern><clipPath id="r"><rect width="580" height="176" rx="14"/></clipPath></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes drawL{from{stroke-dashoffset:1}}
@keyframes trav{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(640px);opacity:0}}
.pop,.rise{animation:rise .6s ease-out var(--d,0s) both}
.f{animation:fade .8s ease-out var(--d,0s) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
.spine{transform-box:fill-box;transform-origin:top;animation:growY .9s ease-out both}
.trav{animation:trav 5s ease-in-out 2.2s infinite}
.ul{stroke-dasharray:1;animation:drawL .8s ease-out var(--d,0s) both}
@media (prefers-reduced-motion:reduce){.pop,.rise,.f,.pulse,.spine,.trav,.ul{animation:none}.trav{opacity:0}}
</style>
<g clip-path="url(#r)"><rect width="580" height="176" fill="#17325C"/><rect width="580" height="176" fill="url(#minor)"/></g>
<rect x=".75" y=".75" width="578.5" height="174.5" rx="13.5" fill="none" stroke="#35557F" stroke-width="1.5"/>
<g class="rise" style="--d:0.00s"><text x="28" y="50" font-size="24" font-weight="700" fill="#EAF1FB">Health Monitoring System</text>
<text x="552" y="48" text-anchor="end" font-size="14" font-weight="600" fill="#FFB02E">Academic</text>
<path class="ul" pathLength="1" style="--d:0.00s" d="M28 62 H88" stroke="#FFB02E" stroke-width="2.5" stroke-linecap="round"/>
<text x="28" y="86" font-size="15.5" fill="#AFC3E2">Web-based school clinic system for Maloro Elementary</text>
<text x="28" y="108" font-size="15.5" fill="#AFC3E2">School, with manuscript, DFDs and requirements.</text>
<rect x="28" y="130" width="46" height="26" rx="13" fill="none" stroke="#4A6FA5" stroke-width="1.3"/><text x="51.0" y="147.5" text-anchor="middle" font-size="13" fill="#EAF1FB">Web</text><rect x="84" y="130" width="122" height="26" rx="13" fill="none" stroke="#4A6FA5" stroke-width="1.3"/><text x="145.0" y="147.5" text-anchor="middle" font-size="13" fill="#EAF1FB">School clinic</text>
</g></svg>
