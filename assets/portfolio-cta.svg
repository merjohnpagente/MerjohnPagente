<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
<title id="t">See every project on my portfolio</title>
<desc id="d">Live demos, source code and the story behind each build at merjohnpagente.github.io</desc>
<defs>
<pattern id="gridMinor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2B4C80" stroke-width="1" opacity="0.35"/></pattern>
<pattern id="gridMajor" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#3B6AA8" stroke-width="1.2" opacity="0.28"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFB02E" stop-opacity="0.2"/><stop offset="100%" stop-color="#FFB02E" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#24466F"/><stop offset="100%" stop-color="#142C50"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFB02E"/><stop offset="100%" stop-color="#FFB02E" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
<filter id="glowDot" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cardClip"><rect width="1200" height="260" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes floaty2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(-1.2deg)}}
@keyframes cubeTurn{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6px) rotate(8deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.f{animation:fade .9s ease-out var(--d,0s) both}
.float1{animation:floaty 6.5s ease-in-out -1.2s infinite}
.float2{animation:floaty2 8s ease-in-out -3.8s infinite}
.cube{transform-box:fill-box;transform-origin:center;animation:cubeTurn 5.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rise,.f,.float1,.float2,.cube{animation:none}.orbitDot{display:none}}
</style>
<g clip-path="url(#cardClip)">
<rect width="1200" height="260" fill="#17325C"/>
<rect width="1200" height="260" fill="url(#gridMinor)"/>
<rect width="1200" height="260" fill="url(#gridMajor)"/>
<ellipse cx="950" cy="140" rx="300" ry="170" fill="url(#glow)"/>
<g stroke="#3B6AA8" stroke-width="1" opacity="0.18">
<path d="M700 260 L950 150"/><path d="M780 260 L950 150"/><path d="M860 260 L950 150"/><path d="M940 260 L950 150"/><path d="M1020 260 L950 150"/><path d="M1100 260 L950 150"/><path d="M1180 260 L950 150"/>
</g>
</g>
<rect x=".75" y=".75" width="1198.5" height="258.5" rx="17.5" fill="none" stroke="#35557F" stroke-width="1.5"/>

<g class="rise" style="--d:.08s"><text x="60" y="58" font-size="13" font-weight="700" fill="#FFB02E" letter-spacing="3">THE FULL PORTFOLIO</text></g>
<g class="rise" style="--d:.18s"><text x="60" y="110" font-size="38" font-weight="800" fill="#EAF1FB" letter-spacing="-0.8">Every project. One place.</text></g>
<g class="f" style="--d:.34s">
<text x="60" y="148" font-size="17" fill="#AFC3E2">Live demos, source code and the story behind each build.</text>
<text x="60" y="196" font-size="17" font-weight="600" fill="#FFB02E">merjohnpagente.github.io</text>
<path d="M60 204 H284" stroke="url(#rule)" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="234" font-size="12" fill="#6F87AD">Live demos · source code · case studies</text>
</g>

<g class="orbitDot" transform="translate(950 140) rotate(-12)">
<ellipse rx="190" ry="64" fill="none" stroke="#FFB02E" stroke-opacity="0.2" stroke-width="1.3" stroke-dasharray="3 8"/>
<ellipse rx="190" ry="64" fill="none" stroke="#3B6AA8" stroke-opacity="0.25" stroke-width="1"/>
<circle r="4" fill="#FFB02E" filter="url(#glowDot)"><animateMotion dur="8s" repeatCount="indefinite" path="M -190 0 A 190 64 0 1 0 190 0 A 190 64 0 1 0 -190 0"/></circle>
</g>

<g transform="translate(838 52) rotate(-7)"><g class="float1" filter="url(#shadow)">
<rect x="8" y="8" width="230" height="130" rx="8" fill="#0B1B33"/>
<rect x="4" y="4" width="230" height="130" rx="8" fill="#0F2444"/>
<rect width="230" height="130" rx="8" fill="url(#panel)" stroke="#4A6FA5" stroke-width="1.2"/>
<path d="M0 28 H230" stroke="#35557F" stroke-width="1"/>
<circle cx="16" cy="14" r="3.5" fill="#FF6B6B"/><circle cx="28" cy="14" r="3.5" fill="#FFB02E"/><circle cx="40" cy="14" r="3.5" fill="#3DDC97"/>
<rect x="58" y="8" width="130" height="12" rx="6" fill="#0F2444"/>
<rect x="18" y="46" width="112" height="9" rx="4.5" fill="#FFB02E"/>
<rect x="18" y="64" width="170" height="6" rx="3" fill="#4A6FA5"/>
<rect x="18" y="78" width="146" height="6" rx="3" fill="#4A6FA5"/>
<rect x="18" y="98" width="60" height="20" rx="5" fill="#2B4C80" stroke="#4A6FA5" stroke-width=".8"/>
<rect x="86" y="98" width="60" height="20" rx="5" fill="#2B4C80" stroke="#4A6FA5" stroke-width=".8"/>
<rect x="24" y="105" width="32" height="4" rx="2" fill="#FFB02E" opacity=".85"/>
<rect x="92" y="105" width="32" height="4" rx="2" fill="#FFB02E" opacity=".5"/>
</g></g>

<g transform="translate(1052 68) rotate(8)"><g class="float2" filter="url(#shadow)">
<rect x="7" y="7" width="82" height="160" rx="17" fill="#0B1B33"/>
<rect x="3" y="3" width="82" height="160" rx="17" fill="#0F2444"/>
<rect width="82" height="160" rx="17" fill="url(#panel)" stroke="#4A6FA5" stroke-width="1.2"/>
<rect x="25" y="7" width="32" height="6" rx="3" fill="#0B1B33"/>
<rect x="11" y="24" width="60" height="54" rx="8" fill="#2B4C80"/>
<circle cx="41" cy="51" r="12" fill="#FFB02E" opacity=".95"/>
<path d="M36 51 l3.5 3.5 l7 -8" stroke="#17325C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="90" width="50" height="6" rx="3" fill="#FFB02E" opacity=".85"/>
<rect x="16" y="104" width="38" height="5" rx="2.5" fill="#4A6FA5"/>
<rect x="16" y="118" width="46" height="5" rx="2.5" fill="#4A6FA5"/>
<rect x="16" y="134" width="50" height="16" rx="8" fill="#FFB02E" opacity=".92"/>
</g></g>

<g transform="translate(1028 205)"><g class="cube">
<polygon points="0,-16 16,-8 0,0 -16,-8" fill="#FFB02E" opacity=".95"/>
<polygon points="-16,-8 0,0 0,20 -16,12" fill="#B57C16"/>
<polygon points="16,-8 0,0 0,20 16,12" fill="#D99A24"/>
<path d="M0,-16 L16,-8 L0,0 L-16,-8 Z" fill="none" stroke="#FFD27A" stroke-width="1" opacity=".8"/>
</g></g>

<circle cx="1128" cy="204" r="34" fill="#FFB02E"/>
<path d="M1114 218 L1141 191 M1120 191 H1141 V212" fill="none" stroke="#17325C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
