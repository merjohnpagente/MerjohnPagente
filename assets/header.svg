<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Merjohn Pagente</title>
<desc id="d">BSCS student at Tangub City Global College who builds web and mobile apps.</desc>
<defs>
<pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2B4C80" stroke-width="1" opacity="0.45"/></pattern>
<pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#3B6AA8" stroke-width="1.2" opacity="0.5"/></pattern>
<clipPath id="r"><rect width="1200" height="320" rx="18"/></clipPath>
</defs>
<style>
.draw{stroke-dasharray:1;animation:draw 1.3s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.draw,.fade{animation:none}}
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}

@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes drawL{from{stroke-dashoffset:1}}
@keyframes trav{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(640px);opacity:0}}
.pop,.rise{animation:rise .6s ease-out var(--d,0s) both}
.f{animation:fade .8s ease-out var(--d,0s) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
.spine{transform-box:fill-box;transform-origin:top;animation:growY .9s ease-out both}
.trav{animation:trav 5s ease-in-out 2.2s infinite}
.ul{stroke-dasharray:1;animation:drawL .8s ease-out var(--d,0s) both}
@media (prefers-reduced-motion:reduce){.pop,.rise,.f,.pulse,.spine,.trav,.ul{animation:none}.trav{opacity:0}}
</style>
