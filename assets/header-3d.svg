<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
<title id="t">Merjohn Pagente — BSCS student at Tangub City Global College</title>
<desc id="d">Web developer and UI/UX designer who builds web apps, mobile apps and offline tools.</desc>
<defs>
<pattern id="gridMinor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2B4C80" stroke-width="1" opacity="0.35"/></pattern>
<pattern id="gridMajor" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#3B6AA8" stroke-width="1.2" opacity="0.28"/></pattern>
<radialGradient id="glowGold" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFB02E" stop-opacity="0.22"/><stop offset="100%" stop-color="#FFB02E" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3B6AA8" stop-opacity="0.38"/><stop offset="100%" stop-color="#3B6AA8" stop-opacity="0"/></radialGradient>
<linearGradient id="panelFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#24466F"/><stop offset="100%" stop-color="#142C50"/></linearGradient>
<linearGradient id="panelFace2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1D3A66"/><stop offset="100%" stop-color="#0F2444"/></linearGradient>
<linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFB02E" stop-opacity="0"/><stop offset="50%" stop-color="#FFB02E"/><stop offset="100%" stop-color="#FFB02E" stop-opacity="0"/></linearGradient>
<filter id="softShadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cardClip"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1.1deg)}}
@keyframes floaty2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(-1.2deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.08)}}
@keyframes drift{0%{opacity:0;transform:translateY(14px)}18%{opacity:.9}82%{opacity:.25}100%{opacity:0;transform:translateY(-46px)}}
@keyframes cubeTurn{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-7px) rotate(8deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.f{animation:fade .9s ease-out var(--d,0s) both}
.float1{animation:floaty 7s ease-in-out -1s infinite}
.float2{animation:floaty2 8.5s ease-in-out -3.4s infinite}
.float3{animation:floaty 9s ease-in-out -5.6s infinite}
.cube{transform-box:fill-box;transform-origin:center;animation:cubeTurn 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5.5s ease-in-out infinite}
.part{animation:drift 6s ease-in-out infinite}
.p2{animation-duration:7.5s;animation-delay:-2.4s}
.p3{animation-duration:8.5s;animation-delay:-4.1s}
.p4{animation-duration:6.8s;animation-delay:-1.2s}
.p5{animation-duration:9s;animation-delay:-5.2s}
@media (prefers-reduced-motion:reduce){.rise,.f,.float1,.float2,.float3,.cube,.pulse,.part{animation:none}.orbitDot{display:none}}
</style>
<g clip-path="url(#cardClip)">
<rect width="1200" height="360" fill="#17325C"/>
<rect width="1200" height="360" fill="url(#gridMinor)"/>
<rect width="1200" height="360" fill="url(#gridMajor)"/>
