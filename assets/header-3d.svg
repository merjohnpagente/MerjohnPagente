<g class="rise" style="--d:.2s">
<text x="60" y="154" font-size="62" font-weight="800" fill="#0B1B33" opacity=".55" letter-spacing="-1.5">Merjohn Pagente</text>
<text x="60" y="150" font-size="62" font-weight="800" fill="#EAF1FB" letter-spacing="-1.5">Merjohn Pagente</text>
</g>
<g class="rise" style="--d:.32s"><text x="62" y="192" font-size="22" font-weight="600" fill="#FFB02E">Web Developer · UI/UX Designer</text></g>
<g class="f" style="--d:.46s">
<text x="62" y="234" font-size="17" fill="#AFC3E2">I build web apps, mobile apps and offline tools</text>
<text x="62" y="258" font-size="17" fill="#AFC3E2">that solve real problems.</text>
</g>
