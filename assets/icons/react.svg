<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 100" width="84" height="100" role="img" aria-label="React">
<title>React</title>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes pulse{50%{opacity:.7}}
.pop{animation:rise .5s ease-out both}
.pulse{animation:pulse 3.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pop,.pulse{animation:none}}</style>
<rect x=".75" y=".75" width="82.5" height="98.5" rx="14" fill="#17325C" stroke="#35557F" stroke-width="1.5"/>
<g class="pop"><g transform="translate(42 45)">
<ellipse rx="26" ry="9.5" fill="none" stroke="#61DAFB" stroke-width="2.4"/>
<ellipse rx="26" ry="9.5" fill="none" stroke="#61DAFB" stroke-width="2.4" transform="rotate(60)"/>
<ellipse rx="26" ry="9.5" fill="none" stroke="#61DAFB" stroke-width="2.4" transform="rotate(120)"/>
<circle class="pulse" r="4.2" fill="#61DAFB"/>
</g></g>
<text x="42" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#EAF1FB">React</text>
</svg>
