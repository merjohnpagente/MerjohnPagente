<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Merjohn's portfolio website</title>
<desc id="d">An animated preview that cycles through the Home, About, My Work and Contact pages.</desc>
<defs><pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2B4C80" stroke-width="1" opacity="0.3"/></pattern>
<pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#3B6AA8" stroke-width="1.2" opacity="0.35"/></pattern><clipPath id="r"><rect width="1200" height="400" rx="18"/></clipPath><clipPath id="b"><rect x="48" y="48" width="620" height="304" rx="14"/></clipPath></defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
.scene{opacity:0;animation:show 12s linear var(--d) infinite backwards}
.s1,.scene.u0{opacity:1}
@keyframes show{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%,100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 12s ease-out var(--d) infinite backwards}
@keyframes grow{0%{transform:scaleX(0)}7%,100%{transform:scaleX(1)}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.in{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.scene,.bar,.cursor,.in,.nudge{animation:none}.s1{opacity:1}}
</style>
<g clip-path="url(#r)"><rect width="1200" height="400" fill="#17325C"/><rect width="1200" height="400" fill="url(#minor)"/><rect width="1200" height="400" fill="url(#major)"/></g>
