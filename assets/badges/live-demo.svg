<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 28" width="118" height="28" role="img" aria-label="LIVE DEMO">
<title>LIVE DEMO</title>
<style>text{font-family:Verdana,Geneva,DejaVu Sans,sans-serif;font-size:11px;font-weight:700;fill:#fff;text-anchor:middle}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes flame{0%,100%{opacity:.75;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.25)}}
.rocket{animation:bounce 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flame{animation:flame .75s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
@media (prefers-reduced-motion:reduce){.rocket,.flame{animation:none}}
</style>
<rect width="118" height="28" rx="6" fill="#D99A24"/>
<g class="rocket" transform="translate(14 5)">
  <path d="M7 0 L11 6 L11 15 L7 20 L3 15 L3 6 Z" fill="#17325C"/>
  <circle cx="7" cy="8" r="2" fill="#FFB02E"/>
  <path class="flame" d="M7 20 L4 25 L7 23 L10 25 Z" fill="#FF6B35"/>
</g>
<text x="73" y="18">LIVE DEMO</text>
</svg>
